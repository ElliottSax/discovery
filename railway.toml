[build]
builder = "nixpacks"

[deploy]
startCommand = "python continuous_monitor.py"
healthcheckPath = "/health"
healthcheckTimeout = 300
sleepApplication = false
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[env]
PYTHONUNBUFFERED = "1"
CHECK_INTERVAL_MINUTES = "30"
MONTHLY_BUDGET = "10.0"
